<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyping</title>
<style>
  :root { --bg: #fafafa; --ink: #18181b; --muted: #71717a; --line: #e4e4e7; --card: #fff; --hover: #f4f4f5; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --ink: #ececee; --muted: #8b8b93; --line: #27272a; --card: #18181b; --hover: #1f1f23; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 96px 20px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 32px; }
  nav { display: grid; gap: 10px; }
  a.tool { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    color: inherit; text-decoration: none; font-weight: 500; transition: background .12s, border-color .12s; }
  a.tool:hover { background: var(--hover); border-color: var(--muted); }
  a.tool span { color: var(--muted); }
  @media (max-width: 480px) { main { padding: 56px 16px; } }
</style>
</head>
<body>
<main>
  <h1>Prototyping</h1>
  <nav>
    <a class="tool" href="resume/">Resume Customizer <span aria-hidden="true">→</span></a>
  </nav>
</main>
</body>
</html>
